<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcani - Cortona Francesca</title>
    <style>
        /* Stili generali coerenti con la Home */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #0b0b0b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .logo span {
            display: block;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 4px;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        nav a:hover, nav a.active {
            color: #d4af37;
        }
        
        /* Sezioni riprese dalla Home */
        .section-title {
            text-align: center;
            padding: 60px 20px 20px 20px;
        }
        .section-title h1 {
            color: #d4af37;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .section-title p {
            color: #999;
            font-size: 1.1rem;
        }

        /* Griglia delle immagini degli Arcani */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .card-arcano {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card-arcano:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .card-arcano img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .card-info {
            padding: 20px;
            text-align: center;
        }
        .card-info h3 {
            color: #d4af37;
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        
        footer {
            background-color: #0b0b0b;
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Header con il menu completo -->
    <header>
        <a href="index.html" class="logo">
            CORTONA
            <span>FRANCESCA</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="arcani.html" class="active">ARCANI</a></li>
                <li><a href="opere.html">OPERE</a></li>
                <li><a href="mostre.html">MOSTRE & CRITICA</a></li>
                <li><a href="chakra.html">7 CHAKRA COLLECTION</a></li>
                <li><a href="contatti.html">CONTATTI</a></li>
            </ul>
        </nav>
    </header>

    <!-- Sezione Principale Arcani -->
    <section class="section-title">
        <h1>ARCANI DI FRANCESCA CORTONA</h1>
        <p>I 22 Arcani Maggiori dipinti a mano ispirati alle leggi universali e alle virtù.</p>
    </section>

    <!-- Griglia delle foto: Assicurati che i nomi dei file in 'src' corrispondano esattamente a quelli nella cartella del sito -->
    <div class="gallery-container">
        <div class="card-arcano">
            <img src="images/arcano1.jpg" alt="Il Matto">
            <div class="card-info">
                <h3>0 - Il Matto</h3>
            </div>
        </div>
        <div class="card-arcano">
            <img src="images/arcano2.jpg" alt="Il Mago">
            <div class="card-info">
                <h3>I - Il Mago</h3>
            </div>
        </div>
        <!-- Aggiungi qui gli altri arcani seguendo lo stesso blocco -->
    </div>

    <footer>
        <p>&copy; 2026 Francesca Cortona. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
