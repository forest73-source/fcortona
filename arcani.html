<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcani di Francesca Cortona</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-card: #121318;
            --gold-primary: #C5A059;
            --gold-bright: #D4AF37;
            --gold-light: #e6ca85;
            --text-light: #e0e0e0;
            --text-white: #ffffff;
            --text-muted: #9a9a9a;
            --font-serif: 'Cinzel', serif;
            --font-quote: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-sans);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* HEADER NAV */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 12, 16, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            z-index: 1000;
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .logo span.sub {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2.2rem;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--gold-primary);
        }

        /* MAIN HERO TITLE */
        .arcani-header {
            padding-top: 10rem;
            padding-bottom: 3rem;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .arcani-header h1 {
            font-family: var(--font-serif);
            font-size: 5rem;
            color: var(--text-white);
            letter-spacing: 8px;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 1.5rem;
        }

        .arcani-header .divider-symbol {
            color: var(--gold-primary);
            font-size: 1.2rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .arcani-header .divider-symbol::before,
        .arcani-header .divider-symbol::after {
            content: '';
            display: inline-block;
            width: 50px;
            height: 1px;
            background: rgba(197, 160, 89, 0.4);
        }

        .arcani-header .subtitle-gold {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--gold-primary);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .arcani-header .edition-tag {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            display: block;
        }

        .arcani-header h2 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--text-white);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">Arcani<span class="sub">Collezione</span></a>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="arcani-header">
        <span class="edition-tag">Prima Edizione</span>
        <h1>ARCANI</h1>
        <div class="divider-symbol">♦</div>
        <div class="subtitle-gold">Collezione d'Arte</div>
        <h2>Maggiore</h2>
    </div>
</body>
</html>
